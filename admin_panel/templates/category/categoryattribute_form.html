{% extends "admin-base.html" %}
{% block content %}
<h2>{% if object %}Edit{% else %}Add{% endif %} Category Attribute</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" style="padding:6px 12px; background:#2563eb; color:#fff; border:none; border-radius:4px;">Save</button>
    <a href="{% url 'categoryattribute_list' %}" style="padding:6px 12px; background:#f3f4f6; color:#111; border-radius:4px; text-decoration:none;">Cancel</a>
</form>
{% endblock %}
