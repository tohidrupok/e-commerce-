{% extends "admin-base.html" %}
{% block content %}

<style>
    .payment-wrapper {
        max-width: 650px;
        margin: 0 auto;
        padding: 20px;
    }
    .payment-card {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        overflow: hidden;
    }
    .payment-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 22px 28px;
        color: #fff;
    }
    .payment-header h2 {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
    }
    .payment-body {
        padding: 32px 28px;
    }
    .form-group {
        margin-bottom: 22px;
    }
    .form-group label {
        font-weight: 600;
        margin-bottom: 6px;
        display: block;
        font-size: 14px;
        color: #2d3748;
    }
    .form-control {
        padding: 12px 14px;
        border: 2px solid #e2e8f0;
        border-radius: 8px;
        font-size: 15px;
        background: #f7fafc;
        width: 100%;
    }
    .btn-submit {
        width: 100%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #fff;
        padding: 12px;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
    }
</style>

<div class="payment-wrapper">
    <div class="payment-card">

        <div class="payment-header">
            <h2>Update Payment — Order #{{ order.id }}</h2>
        </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %} 


        <div class="payment-body">
            <form method="post">
                {% csrf_token %}

                <!-- Payment Method -->
                <div class="form-group">
                    <label>Payment Method</label>
                    <select name="payment_method" class="form-control" required
                            onchange="toggleTxn(this.value)">
                        <option value="">-- Select Method --</option>
                        <option value="cash">Cash</option>
                        <option value="bkash">bKash</option>
                        <option value="nagad">Nagad</option>
                        <option value="bank">Bank</option>
                        <option value="online">Online</option>
                    </select>
                </div>

                <!-- Amount -->
                <div class="form-group">
                    <label>Amount Paid (New Payment)</label>
                    <input type="number" step="0.01" name="amount_paid"
                           class="form-control" placeholder="Enter amount" required>
                    <small style="color:#666;">
                        Total Paid: {{ order.amount_paid }} / {{ order.total }}
                    </small>
                </div>

                <!-- Transaction -->
                <div class="form-group" id="txn-box">
                    <label>Transaction ID</label>
                    <input type="text" name="payment_transaction_id"
                           class="form-control"
                           placeholder="Required for non-cash payment">
                </div>

                <!-- Note -->
                <div class="form-group">
                    <label>Payment Note</label>
                    <textarea name="payment_note" rows="3"
                              class="form-control"
                              placeholder="Optional note"></textarea>
                </div>

                <button type="submit" class="btn-submit">
                    Add Payment
                </button>
            </form>
        </div>

    </div>
</div>

<script>
function toggleTxn(method){
    document.getElementById("txn-box").style.display =
        (method === "cash") ? "none" : "block";
}
</script>

{% endblock %}
